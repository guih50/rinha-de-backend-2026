[package]
name = "rinha"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "rinha"
path = "src/main.rs"

[[bin]]
name = "recall_check"
path = "src/bin/recall_check.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "sync"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
memchr = "2"
lexical-core = "1"
phf = { version = "0.11", features = ["macros"] }

[build-dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
